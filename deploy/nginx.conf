# 注意：目标机 80/443 已被现有站点占用，这个模板不能直接套用抢默认站点。
# 正确做法：独立 listen 8080 的 server 块 + proxy_pass http://127.0.0.1:5001。
# 详见 DEPLOYED.md 第二十七节。
server {
    listen 8080;
    server_name _;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 慢请求（生成/AI 重写/换标题要调模型）必须放宽超时，否则 nginx 默认
        # 60s 掐断 → 浏览器收到 504 Gateway Time-out，但服务端其实还在写。
        # 现在网页生成已改成异步（请求秒回），正常很快；但 optimize/retitle
        # 仍是同步调 AI，保留长超时兜底。
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
