<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成品预览</title>
  <style>
    body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
           color:#1f2937; line-height:1.95; margin:0; }
    h1 { font-size:26px; line-height:1.4; margin:0 0 14px; }
    h2 { font-size:19px; margin:28px 0 10px; padding-left:10px; border-left:3px solid #1d4ed8; }
    p { margin:0 0 20px; font-size:17px; letter-spacing:.4px; }
    ul, li { font-size:17px; letter-spacing:.4px; }
    .by { color:#6b7280; font-size:13px; border-bottom:1px solid #e5e7eb;
          padding-bottom:14px; margin-bottom:22px; }
    .tags { margin-top:30px; padding-top:16px; border-top:1px solid #e5e7eb;
            color:#6b7280; font-size:13px; }
  </style>
</head>
<body>
  <h1>{{ title }}</h1>
  <div class="by">{{ author }} · 发布于 {{ platforms | join(' / ') }}</div>
  {{ body | safe }}
  <div class="tags">发布平台：{{ platforms | join(' · ') }}</div>
</body>
</html>
